      import {
        init,
        Wasmer,
      } from "https://unpkg.com/@wasmer/sdk@latest/dist/index.mjs";

      async function runPython() {
        const status = document.getElementById("status");

        status.innerHTML = "Initializing...";
        await init();

        status.innerHTML = `Fetching...`;
        const pkg = await Wasmer.fromWasm("test.wasm");
        status.innerHTML = `Loaded`;
        console.log(pkg, pkg.entrypoint);
        const instance = await pkg.entrypoint.run();//{args: ["-c", "print('Hello, World!')"],});
        let result = await instance.wait();
        console.log("START",result, "END");
        console.log("out",result.stdout, "-out");
        console.log("err",result.stderr, "-err");
      }

      runPython();


    </script>

  <body>
    <h1 id="status"></h1>
    <pre><code id="stdout"></code></pre>
