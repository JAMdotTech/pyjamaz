volumes:
  pyjamaz-blocks:
  pyjamaz-data-alice:
  pyjamaz-data-bob:
  pyjamaz-data-charlie:
  pyjamaz-data-dave:
  pyjamaz-data-eve:
  pyjamaz-data-ferdie:
  pyjamaz-traces-alice:
  pyjamaz-traces-bob:
  pyjamaz-traces-charlie:
