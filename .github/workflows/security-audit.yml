name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: "2.7.3"
  BANDIT_VERSION: "1.7.9"
  SEMGREP_VERSION: "1.78.0"
  SYFT_VERSION: "1.20.0"
  GITLEAKS_VERSION: "8.18.4"

jobs:
  graypaper-security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin" "v${SYFT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b "$HOME/.local/bin" "v${GITLEAKS_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Gray Paper security audit harness
        run: bash scripts/security_audit.sh --install-python-tools

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graypaper-security-audit
          path: artifacts/security/graypaper-audit
          if-no-files-found: error
