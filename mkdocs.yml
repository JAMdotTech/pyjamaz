site_name: PyJAMaz Docs
repo_url: https://github.com/JAMdotTech/pyjamaz
edit_uri: edit/main/docs/
site_description: Python implementation of the Jam graypaper

theme:
  name: "material"
  logo: https://avatars.githubusercontent.com/u/171914595?s=48&v=4
  features:
    # - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
#    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
#    - toc.integrate

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
#            docstring_section_style: list
            members_order: source
            show_root_heading: false
            show_source: true
            show_signature_annotations: true
            docstring_style: numpy
            heading_level: 2

  - autorefs
  - search

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/JAMdotTech
  - icon: fontawesome/brands/twitter
    link: https://twitter.com/JAMdotTech

nav:
  - Overview: index.md
  - Type Definitions:
      - Block Types: types/types_blocks.md
      - State Types: types/types_state.md
      - STF Output Types: types/types_stf_output.md
  - State Transition Functions:
      - Overall State (σ): stfs/sigma.md
      - AuthorizerPools (α): stfs/alpha.md
      - Recent History (β): stfs/beta.md
      - Safrole (γ): stfs/gamma.md
      - Services (δ): stfs/delta.md
      - Entropy (η): stfs/eta.md
      - Validator Queue (ι): stfs/iota.md
      - Validator Pool (κ): stfs/kappa.md
      - Validator Archive (λ): stfs/lambda.md
      - Assurances (ρ): stfs/rho.md
      - Timeslot (τ): stfs/tau.md
      - Authorizer Queues (𝜙): stfs/phi.md
      - Privileged Services (χ): stfs/chi.md
      - Disputes (ψ): stfs/psi.md
      - Statistics (π): stfs/pi.md
  - Function Reference:
      - PVM: reference/pvm.md
      - Signing: reference/signing.md
      - Hashing: reference/hashing.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

